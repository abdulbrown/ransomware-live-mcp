[project]
name = "ransomware-live-mcp"
version = "0.1.0"
description = "MCP server exposing the ransomware.live PRO threat-intelligence API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "abdulbrown" }]
keywords = ["mcp", "ransomware", "threat-intelligence", "security", "cti"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "mcp[cli]>=2.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.urls]
Homepage = "https://github.com/abdulbrown/ransomware-live-mcp"
Repository = "https://github.com/abdulbrown/ransomware-live-mcp"
Issues = "https://github.com/abdulbrown/ransomware-live-mcp/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
ransomware-live-mcp = "ransomware_live_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ransomware_live_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
